# project_id is overridden at deploy time by --project-ref. The value here
# is a placeholder required by the Supabase CLI to parse this file at all.
project_id = "hooper"

[functions.signin-with-username]
verify_jwt = false

[auth]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Your Hooper verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Hooper password"
content_path = "./supabase/templates/recovery.html"

# The magic-link template is repurposed for the "account already exists" email.
# It is the template GoTrue sends from signInWithOtp({ shouldCreateUser: false }),
# which auth.service.ts triggers when a sign-up is attempted with an email that
# already has an account. Hooper does not otherwise use magic-link sign-in.
[auth.email.template.magic_link]
subject = "You already have a Hooper account"
content_path = "./supabase/templates/account_exists.html"
