name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pr-previews.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build and publish a preview for"
        required: true
        type: string

jobs:
  preview:
    name: eas-update-preview
    if: >-
      !(github.head_ref == 'dev' && github.base_ref == 'main') &&
      !(github.head_ref == 'main' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            let number, title, body, headRef, headSha;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              number = pr.number;
              title = pr.title || '';
              body = pr.body || '';
              headRef = pr.head.ref;
              headSha = pr.head.sha;
            } else {
              number = Number(process.env.INPUT_PR_NUMBER);
              if (!number) {
                core.setFailed('pr_number input is required for manual runs.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              title = pr.title || '';
              body = pr.body || '';
              headRef = pr.head.ref;
              headSha = pr.head.sha;
            }
            core.setOutput('number', String(number));
            core.setOutput('title', title);
            core.setOutput('body', body);
            core.setOutput('head_ref', headRef);
            core.setOutput('head_sha', headSha);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Build preview metadata
        id: preview_meta
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          TITLE_SLUG=$(printf '%s' "$PR_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-40)

          if [ -z "$TITLE_SLUG" ]; then
            TITLE_SLUG="update"
          fi

          BRANCH="pr-${PR_NUMBER}-$TITLE_SLUG"

          BODY_SUMMARY=$(printf '%s' "$PR_BODY" \
            | tr '\n' ' ' \
            | sed -E 's/[[:space:]]+/ /g; s/^ +| +$//g' \
            | cut -c1-140)

          if [ -n "$BODY_SUMMARY" ]; then
            MESSAGE="PR #${PR_NUMBER}: $PR_TITLE | $BODY_SUMMARY"
          else
            MESSAGE="PR #${PR_NUMBER}: $PR_TITLE"
          fi

          {
            echo "branch=$BRANCH"
            echo "message<<EOF"
            echo "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert preview comment (building)
        id: preview_comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_BRANCH: ${{ steps.preview_meta.outputs.branch }}
          PREVIEW_MESSAGE: ${{ steps.preview_meta.outputs.message }}
        with:
          script: |
            const marker = '<!-- eas-preview-comment -->';
            const issueNumber = Number(process.env.PR_NUMBER);
            const branch = process.env.PREVIEW_BRANCH;
            const message = process.env.PREVIEW_MESSAGE;
            const body = `${marker}\n### 🟠 Preview Building\n\nPreparing EAS Update for branch \`${branch}\`.\n\nPlanned message: \`${message}\``;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            );

            let commentId;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              commentId = existing.id;
            } else {
              const { data: created } = await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              commentId = created.id;
            }

            core.setOutput('comment_id', String(commentId));

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          # Only `eas update` is run below — the legacy global expo-cli isn't
          # needed and its (unmaintained) dep tree just adds noise + install time.
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview update
        id: publish
        shell: bash
        working-directory: apps/mobile
        run: |
          # Branch and message are passed via env (not inlined as GitHub
          # expressions) so that quotes or other shell metacharacters in the
          # PR title/body cannot break this command.
          OUTPUT=$(eas update \
            --branch "$PREVIEW_BRANCH" \
            --environment preview \
            --message "$PREVIEW_MESSAGE" \
            --json)

          GROUP_ID=$(echo "$OUTPUT" | jq -r '.[0].group // empty')
          UPDATE_MESSAGE=$(echo "$OUTPUT" | jq -r '.[0].message // empty')
          RUNTIME_VERSION=$(echo "$OUTPUT" | jq -r '.[0].runtimeVersion // empty')
          CREATED_AT=$(echo "$OUTPUT" | jq -r '.[0].createdAt // empty')

          if [ -n "$GROUP_ID" ]; then
            DASHBOARD_URL="https://expo.dev/accounts/hoop33-dev/projects/hooper/updates/${GROUP_ID}"
          else
            DASHBOARD_URL="https://expo.dev/accounts/hoop33-dev/projects/hooper"
          fi

          echo "group_id=$GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "update_message=$UPDATE_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "created_at=$CREATED_AT" >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$DASHBOARD_URL" >> "$GITHUB_OUTPUT"
        env:
          CI: "1"
          PREVIEW_BRANCH: ${{ steps.preview_meta.outputs.branch }}
          PREVIEW_MESSAGE: ${{ steps.preview_meta.outputs.message }}

      - name: Update preview comment (ready)
        if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_BRANCH: ${{ steps.preview_meta.outputs.branch }}
          PREVIEW_COMMENT_ID: ${{ steps.preview_comment.outputs.comment_id }}
          PUBLISH_GROUP_ID: ${{ steps.publish.outputs.group_id }}
          PUBLISH_UPDATE_MESSAGE: ${{ steps.publish.outputs.update_message }}
          PUBLISH_RUNTIME_VERSION: ${{ steps.publish.outputs.runtime_version }}
          PUBLISH_CREATED_AT: ${{ steps.publish.outputs.created_at }}
          PUBLISH_DASHBOARD_URL: ${{ steps.publish.outputs.dashboard_url }}
        with:
          script: |
            const marker = '<!-- eas-preview-comment -->';
            const issueNumber = Number(process.env.PR_NUMBER);
            const branch = process.env.PREVIEW_BRANCH;
            const groupId = process.env.PUBLISH_GROUP_ID;
            const updateMessage = process.env.PUBLISH_UPDATE_MESSAGE;
            const runtimeVersion = process.env.PUBLISH_RUNTIME_VERSION;
            const createdAt = process.env.PUBLISH_CREATED_AT;
            const dashboardUrl = process.env.PUBLISH_DASHBOARD_URL;
            const projectId = '0d004a05-6825-40ab-8640-f2567d841f31';
            const qrUrl = `https://qr.expo.dev/eas-update?slug=exp&projectId=${projectId}&groupId=${groupId}&host=u.expo.dev`;
            const expoPreviewUrl = `https://expo.dev/preview/update?message=${encodeURIComponent(updateMessage)}&updateRuntimeVersion=${encodeURIComponent(runtimeVersion)}&createdAt=${encodeURIComponent(createdAt)}&slug=exp&projectId=${projectId}&group=${groupId}`;
            const body = `${marker}\n### 🟢 Preview Ready\n\nEAS Update published for branch \`${branch}\`.\n\n<img src="${qrUrl}" width="250" height="250" />\n\n[Open Preview](${expoPreviewUrl}) · [Open in EAS Dashboard](${dashboardUrl})\n\nIf you're on mobile with Expo Go installed, use Open Preview or scan the QR code to launch the update.`;

            const commentId = Number(process.env.PREVIEW_COMMENT_ID);
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body,
              });
            } else {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: issueNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
              }
            }

      - name: Update preview comment (failed)
        if: failure()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_BRANCH: ${{ steps.preview_meta.outputs.branch }}
          PREVIEW_MESSAGE: ${{ steps.preview_meta.outputs.message }}
          PREVIEW_COMMENT_ID: ${{ steps.preview_comment.outputs.comment_id }}
        with:
          script: |
            const marker = '<!-- eas-preview-comment -->';
            const issueNumber = Number(process.env.PR_NUMBER);
            const branch = process.env.PREVIEW_BRANCH;
            const message = process.env.PREVIEW_MESSAGE;
            const body = `${marker}\n### 🔴 Preview Failed\n\nFailed to publish EAS Update for branch \`${branch}\`.\n\nPlanned message: \`${message}\`\n\nCheck the workflow logs for details.`;

            if (!issueNumber) {
              core.warning('No PR number available; skipping failure comment.');
              return;
            }

            const commentId = Number(process.env.PREVIEW_COMMENT_ID);
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body,
              });
            } else {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: issueNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
              }
            }
