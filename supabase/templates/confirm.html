<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Verify your Hoop 33 account</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #161213;
        font-family: Arial, Helvetica, sans-serif;
        color: #f5f5f5;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table {
        border-spacing: 0;
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      td {
        padding: 0;
      }
      img {
        border: 0;
        outline: none;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #161213; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px"
          >
            <!-- Card -->
            <tr>
              <td
                style="
                  background-color: #252122;
                  border-radius: 20px;
                  padding: 40px 36px;
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                >
                  <!-- Logo + Headline row -->
                  <tr>
                    <td style="padding-bottom: 8px" valign="top">
                      <span
                        style="
                          display: block;
                          font-size: 30px;
                          font-weight: 900;
                          font-style: italic;
                          color: #f5f5f5;
                          line-height: 1.1;
                          letter-spacing: -0.5px;
                        "
                        >VERIFY YOUR</span
                      >
                      <span
                        style="
                          display: block;
                          font-size: 30px;
                          font-weight: 900;
                          font-style: italic;
                          color: #f26522;
                          line-height: 1.1;
                          letter-spacing: -0.5px;
                        "
                        >ACCOUNT</span
                      >
                    </td>
                    <td align="right" valign="top" style="padding-bottom: 8px">
                      <span
                        style="
                          font-size: 22px;
                          font-weight: 900;
                          letter-spacing: -0.5px;
                          color: #f5f5f5;
                          font-style: italic;
                          white-space: nowrap;
                        "
                        >HOOP <span style="color: #f26522">33</span></span
                      >
                    </td>
                  </tr>

                  <!-- Body copy -->
                  <tr>
                    <td
                      colspan="2"
                      style="
                        padding-top: 16px;
                        padding-bottom: 32px;
                        font-size: 15px;
                        line-height: 22px;
                        color: #7d7b7b;
                      "
                    >
                      Enter this 6-digit code in the Hoop 33 app to complete
                      your sign up. The code expires in&nbsp;1&nbsp;hour.
                    </td>
                  </tr>

                  <!-- OTP code -->
                  <tr>
                    <td colspan="2" align="center" style="padding-bottom: 32px">
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                      >
                        <tr>
                          <td
                            style="
                              background-color: #2e2b2c;
                              border-radius: 12px;
                              padding: 20px 40px;
                            "
                          >
                            <span
                              style="
                                font-size: 40px;
                                font-weight: 700;
                                letter-spacing: 12px;
                                color: #f5f5f5;
                                font-family: 'Courier New', Courier, monospace;
                              "
                              >{{ .Token }}</span
                            >
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <!-- Security note -->
                  <tr>
                    <td
                      colspan="2"
                      style="
                        background-color: #1e1b1c;
                        border-radius: 10px;
                        padding: 14px 18px;
                        font-size: 13px;
                        line-height: 19px;
                        color: #7d7b7b;
                      "
                    >
                      Didn&apos;t request this? You can safely ignore this
                      email &mdash; someone may have entered your address by
                      mistake.
                    </td>
                  </tr>

                  <!-- Copyright -->
                  <tr>
                    <td
                      colspan="2"
                      align="center"
                      style="
                        padding-top: 28px;
                        font-size: 12px;
                        color: #4a4748;
                        line-height: 18px;
                      "
                    >
                      &copy; 2025 Hoop 33. All rights reserved.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
