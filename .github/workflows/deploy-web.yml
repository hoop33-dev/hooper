name: Deploy Web

# Vercel deployment for the Next.js app (apps/web).
#
#   • Pull requests  → Preview deployment, URL posted back as a PR comment.
#   • Push to main   → Production deployment.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       – a Vercel access token
#   VERCEL_ORG_ID      – from `vercel link` / project settings (.vercel/project.json)
#   VERCEL_PROJECT_ID  – ditto
# In the Vercel project, set the Root Directory to `apps/web`.
#
# If VERCEL_TOKEN is not set, the job no-ops and stays green — so the workflow
# is safe to merge before Vercel is wired up.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Guard on Vercel secret
        id: guard
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping Vercel deploy."
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install -g vercel@latest

      - name: Resolve environment
        if: steps.guard.outputs.enabled == 'true'
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        if: steps.guard.outputs.enabled == 'true'
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.guard.outputs.enabled == 'true'
        run: |
          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        if: steps.guard.outputs.enabled == 'true'
        id: deploy
        run: |
          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Comment preview URL
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview-comment -->';
            const url = process.env.DEPLOY_URL;
            const body = `${marker}\n### ▲ Vercel Preview Ready\n\nThe web app for this PR has been deployed to a preview environment:\n\n${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
